server:
  port: 8080

spring:
  application:
    name: webhook-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/webhooks}
    username: ${DB_USER:webhooks}
    password: ${DB_PASSWORD:webhooks}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: delivery-worker
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  kafka:
    topic: webhook-events
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-must-be-at-least-32-bytes}
    expiration-minutes: 120
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  delivery:
    timeout-seconds: 10
    max-attempts: 5
    base-backoff-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: webhook-platform
  endpoint:
    health:
      show-details: always
